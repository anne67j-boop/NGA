<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Grant information and application assistance. Verify program eligibility and official sources before sharing personal information." />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Grant Assistance Information Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: { extend: {
          colors: { brand: { 50:"#f4f8fb",100:"#e3ecf5",200:"#c5dbe9",300:"#96bddd",400:"#649ccf",500:"#4180be",600:"#2c64a0",700:"#234e7f",800:"#1e4066",900:"#1a3655",950:"#0f1f33" } },
          boxShadow: { card:"0 2px 4px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04)", depth:"0 10px 15px -3px rgba(0,0,0,.08), 0 4px 6px -2px rgba(0,0,0,.04)" }
        }}
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <style>
      html { scroll-behavior:smooth; -webkit-font-smoothing:antialiased; }
      body { background:#f8fafc; color:#1e293b; font-family:Inter,system-ui,sans-serif; }
      .dark body { background:#020617; color:#f8fafc; }
      .animate-fade-in { animation:fadeIn .6s ease-out; }
      .animate-fade-in-up { animation:fadeInUp .6s ease-out; }
      @keyframes fadeIn { from{opacity:0} to{opacity:1} }
      @keyframes fadeInUp { from{opacity:0;transform:translateY(15px)} to{opacity:1;transform:translateY(0)} }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/frontend/src/index.tsx"></script>
  </body>
</html>
