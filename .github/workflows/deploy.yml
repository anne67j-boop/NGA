name: NGA security, build and end-to-end checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install
      - name: Block known frontend dependency vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Type-check and production build
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        run: npm run test:e2e

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install API dependencies
        run: npm install --prefix backend
      - name: Block known backend dependency vulnerabilities
        run: npm audit --prefix backend --audit-level=moderate
      - name: Run API abuse-case tests
        run: npm test --prefix backend
