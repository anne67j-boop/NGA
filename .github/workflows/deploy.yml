name: NGA security, build and end-to-end checks

on:
  push:
    branches: ["main", "codex/nga-repair-2026-11-20"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Generate once on the trusted same-repository repair branch; subsequent
      # runs install strictly from the committed lockfiles.
      - name: Generate and commit npm lockfiles
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix backend install --package-lock-only --ignore-scripts --no-audit --no-fund
          git add package-lock.json backend/package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add reproducible npm dependency lockfiles"
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          fi

      - name: Install frontend dependencies from lockfile
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Install frontend dependencies for external fork
        if: hashFiles('package-lock.json') == ''
        run: npm install --ignore-scripts
      - name: Block known frontend dependency vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Type-check and production build
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        run: npm run test:e2e

      - name: Install API dependencies from lockfile
        if: hashFiles('backend/package-lock.json') != ''
        run: npm ci --prefix backend
      - name: Install API dependencies for external fork
        if: hashFiles('backend/package-lock.json') == ''
        run: npm install --ignore-scripts --prefix backend
      - name: Block known backend dependency vulnerabilities
        run: npm audit --prefix backend --audit-level=moderate
      - name: Run API abuse-case tests
        run: npm test --prefix backend
